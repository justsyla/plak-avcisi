<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plak Avcısı - Klinik Hasta Bilgi Kartları | Stj. Dt. Sıla Bayram</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Quicksand', sans-serif; background: #f1f5f9; }
    h1, h2, .font-game { font-family: 'Baloo 2', cursive; }
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .no-print { display: none !important; }
      .print-grid { gap: 12px !important; padding: 10px !important; }
      .card-item { break-inside: avoid; box-shadow: none !important; border: 2px dashed #94a3b8 !important; }
    }
  </style>
</head>
<body class="p-4">

  <div class="no-print max-w-4xl mx-auto mb-4 bg-white p-4 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-3 border border-sky-200">
    <div>
      <h1 class="text-lg font-extrabold text-sky-800">🦷 Plak Avcısı — Klinik Hasta Bilgi Kartları (A4)</h1>
      <p class="text-xs text-slate-600 font-semibold">Tek sayfada 4 hasta kartı bulunur. Yazdırıp keserek hastalarınıza verebilirsiniz.</p>
    </div>
    <button onclick="window.print()" class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-extrabold text-sm shadow">
      🖨️ Yazdır / PDF Kaydet
    </button>
  </div>

  <div id="cards-container" class="print-grid max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4"></div>

  <script>
    const TARGET_URL = "https://justsyla.github.io/plak-avcisi/";
    const QR_IMG = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=${encodeURIComponent(TARGET_URL)}`;

    const singleCard = `
      <div class="card-item bg-white rounded-3xl p-5 border-2 border-sky-300 shadow-md flex flex-col justify-between space-y-3">
        <div class="flex items-center justify-between border-b border-sky-100 pb-2.5">
          <div class="flex items-center gap-2.5">
            <img src="Logo.jpg" onerror="this.style.display='none'" class="w-11 h-11 rounded-xl object-cover border border-sky-200" />
            <div>
              <h2 class="text-xl font-extrabold text-sky-700 leading-none">PLAK AVCISI</h2>
              <p class="text-[11px] font-bold text-emerald-600 mt-0.5">Kral Mutans'a Karşı Klinik Görevi</p>
            </div>
          </div>
          <span class="text-[10px] font-extrabold bg-sky-50 text-sky-800 px-2.5 py-1 rounded-lg border border-sky-200">
            Stj. Dt. Sıla Bayram
          </span>
        </div>

        <div class="flex items-center gap-4">
          <div class="p-2 bg-sky-50 rounded-2xl border border-sky-200 shrink-0 text-center">
            <img src="${QR_IMG}" alt="Plak Avcısı QR Kod" class="w-28 h-28 rounded-lg" />
            <span class="block text-[9px] font-extrabold text-sky-700 mt-1">Kamerayla Okut</span>
          </div>

          <div class="space-y-2 text-xs text-slate-700 font-semibold">
            <p><strong class="text-sky-700">1.</strong> Telefon kamerasıyla QR kodu okut (veya <strong>justsyla.github.io/plak-avcisi</strong> yaz).</p>
            <p><strong class="text-sky-700">2.</strong> Sağ üst menüden <strong>"Ana ekrana ekle / Yükle"</strong> seçeneğine bas.</p>
            <p><strong class="text-sky-700">3.</strong> Kahraman adını ve aşağıdaki <strong>4 haneli şifreni</strong> gir!</p>
          </div>
        </div>

        <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-3 flex items-center justify-between">
          <div>
            <span class="block text-[10px] font-extrabold uppercase text-amber-700">🔑 Ajan Giriş Şifren</span>
            <span class="text-[11px] font-bold text-slate-600">Hedef: ☀️ Sabah & 🌙 Akşam</span>
          </div>
          <div class="flex gap-1.5">
            <span class="w-8 h-9 rounded-lg bg-white border-2 border-amber-400 inline-block"></span>
            <span class="w-8 h-9 rounded-lg bg-white border-2 border-amber-400 inline-block"></span>
            <span class="w-8 h-9 rounded-lg bg-white border-2 border-amber-400 inline-block"></span>
            <span class="w-8 h-9 rounded-lg bg-white border-2 border-amber-400 inline-block"></span>
          </div>
        </div>
      </div>
    `;

    document.getElementById('cards-container').innerHTML = singleCard.repeat(4);
  </script>
</body>
</html>
